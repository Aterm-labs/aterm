# aterm-pro — Community PLACEHOLDER for the private Pro crate (open-core).
#
# The real implementation lives in the private `Aterm-labs/aterm-pro` repo, whose
# `build.sh` copies it over this directory to produce the official binary. This
# placeholder exists only because Cargo needs the manifest of every declared
# `path` dependency to be present, even for an optional one whose feature is off.
#
# Intentionally NOT a workspace member: `aterm` pulls it in through the optional
# `pro` feature, so a Community checkout builds the app without it.
[package]
name = "aterm-pro"
version = "0.1.0"
edition.workspace = true
license = "LicenseRef-proprietary"
description = "Community placeholder for aterm's private Pro features"
publish = false

[dependencies]
aterm-pro-api = { path = "../aterm-pro-api" }
egui = "0.29"
